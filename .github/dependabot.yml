version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    groups:
      compatible:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Zurich
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Zurich
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(runtime)'
